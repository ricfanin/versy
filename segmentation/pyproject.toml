[project]
name = "versy-segmentation"
version = "0.1.0"
description = "YOLOv8n-seg training for table segmentation (Versy robot)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pycocotools>=2.0.7",
    "opencv-python>=4.9",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
